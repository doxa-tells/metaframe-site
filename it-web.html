<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT &amp; Web — METAFRAME</title>
<style>
  @font-face{font-family:'Press Start 2P';src:url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  @font-face{font-family:'Source Code Pro';src:url('assets/fonts/SourceCodePro-VariableFont_wght.ttf') format('truetype-variations');font-weight:200 900;font-display:swap;}
  :root{--brand:#00FCFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000; color:#fff; min-height:100vh;
    font-family:'Source Code Pro', monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:30px; text-align:center; padding:6vw;
  }
  h1{
    font-family:'Press Start 2P','Source Code Pro',monospace;
    word-spacing:-.45em;
    font-weight:700; text-transform:uppercase; color:var(--brand);
    font-size:clamp(42px,9vw,120px); letter-spacing:-.02em; line-height:1;
  }
  p{
    font-family:'Source Code Pro',monospace;
    letter-spacing:.28em; font-size:14px; color:#888;
  }
  a{
    font-family:'Source Code Pro',monospace;
    color:var(--brand); text-decoration:none;
    letter-spacing:.18em; font-size:14px;
    border-bottom:1px solid transparent; padding-bottom:2px;
    transition:border-color .2s;
  }
  a:hover{border-color:var(--brand)}
</style>
</head>
<body>
  <h1>IT &amp; Web</h1>
  <p>РАЗДЕЛ В РАЗРАБОТКЕ</p>
  <a href="index.html">&larr; НА ГЛАВНУЮ</a>
</body>
</html>
